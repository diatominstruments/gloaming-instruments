<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gloaming Instruments</title>
<style>
  :root { --bg: #0a0a12; --fg: #c8d0e0; --dim: #5a6278; --accent: #7fffd4; --panel: #12131f; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-monospace, Menlo, monospace; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 15px; margin: 0 12px 0 0; color: var(--accent); }
  button { font: inherit; background: var(--panel); color: var(--fg); border: 1px solid var(--dim); padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #play { color: var(--accent); }
  #steps { display: flex; gap: 3px; }
  #steps i { width: 14px; height: 14px; background: var(--panel); border: 1px solid var(--dim); }
  #steps i:nth-child(4n+1) { border-color: var(--fg); }
  #steps i.on { background: var(--accent); }
  #scope { width: 100%; height: 80px; color: var(--accent); background: var(--panel); display: block; margin-bottom: 12px; }
  #panels { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  fieldset { margin: 0; border: 1px solid var(--dim); background: var(--panel); }
  legend { color: var(--accent); padding: 0 4px; }
  legend small { color: var(--dim); }
  label { display: grid; grid-template-columns: 88px 1fr 76px; gap: 6px; align-items: center; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select { font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--dim); }
  output { text-align: right; color: var(--dim); }
  fieldset button { margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>gloaming-instruments</h1>
  <button id="play">Play / Stop</button>
  <label style="grid-template-columns: auto 60px">BPM <input id="bpm" type="number" value="125" min="60" max="200"></label>
  <div id="steps"></div>
</header>
<canvas id="scope" width="1200" height="80"></canvas>
<div id="panels"></div>
<script src="../dist/gloaming-instruments.js" defer></script>
<script src="demo.js" defer></script>
</body>
</html>
